<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grover-szimulátor</title>
<style>
:root {
  --paper: #e9eef4;
  --sheet: #fffcf8;
  --rule: #d5dde6;
  --ink: #1b2430;
  --faint: #5b6776;
  --navy: #2c5289;
  --navy-deep: #1e3b66;
  --brick: #c23a2b;
  --ochre: #c3922a;
  --good: #1d7a58;
  --ui: "Noto Sans", "Liberation Sans", "Segoe UI", Cantarell, system-ui, sans-serif;
  --display: "Noto Serif", "Liberation Serif", Georgia, "Palatino Linotype", serif;
}
* { box-sizing: border-box }
html, body { margin: 0; min-height: 100% }
body {
  color: var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, #f7f9fc, transparent 60%),
    var(--paper);
  font: 16px/1.5 var(--ui);
}
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 32px 22px 52px;
}
.masthead {
  border-bottom: 1px solid var(--navy);
  padding: 6px 0 18px;
  text-align: center;
}
h1 {
  margin: 0;
  color: var(--navy-deep);
  font-family: var(--display);
  font-size: clamp(2.7rem, 6.2vw, 3.75rem);
  font-weight: 600;
  letter-spacing: .01em;
}

form, .toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
}
form {
  margin: 22px 0 10px;
  padding: 16px 16px 14px;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(27, 36, 48, .05);
}
label {
  display: grid;
  gap: 5px;
  font: 600 11px/1 var(--ui);
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--faint);
}
input, button, select {
  font: 15px/1.2 var(--ui);
  color: var(--ink);
  background: #fff;
  border: 1px solid #c3cedb;
  border-radius: 8px;
  padding: 8px 12px;
}
input { width: 84px }
button { cursor: pointer }
button:hover:not(:disabled) { background: #f3f6fa; border-color: var(--navy) }
button:disabled { opacity: .4; cursor: default }
button.primary {
  background: var(--navy);
  border-color: var(--navy);
  color: #f7f9fc;
}
button.primary:hover:not(:disabled) { background: var(--navy-deep); border-color: var(--navy-deep) }
button.ghost { background: transparent }
#status {
  min-height: 1.2em;
  margin: 0 0 8px;
  color: var(--brick);
  font: 14px/1.4 var(--ui);
}
#status:empty { display: none }

.toolbar { margin: 8px 0 6px; align-items: center }
#step-label { font-weight: 650; margin-left: 4px; color: var(--navy-deep) }
#prob {
  margin-left: auto;
  font: 650 15px/1 var(--ui);
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}
.meter {
  width: 160px;
  height: 10px;
  background: #e4eaf1;
  border-radius: 999px;
  overflow: hidden;
}
.meter > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--brick);
}

.timeline {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 8px 0 14px;
}
.timeline button {
  min-width: 28px;
  padding: 5px 8px;
  font-size: 11px;
  font-weight: 650;
  border-color: var(--rule);
}
.timeline button[aria-current="step"] {
  background: var(--navy-deep);
  color: #f7f9fc;
  border-color: var(--navy-deep);
}
.timeline button.oracle { border-bottom: 2px solid var(--brick) }
.timeline button.diffusion { border-bottom: 2px solid var(--navy) }
.timeline button.initial { border-bottom: 2px solid var(--ochre) }

.plots {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: 16px;
}
figure {
  margin: 0;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 16px 16px 12px;
  box-shadow: 0 8px 24px rgba(27, 36, 48, .05);
}
figcaption {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  margin-bottom: 8px;
  color: var(--navy-deep);
  font: 650 15px/1.2 var(--ui);
}
figcaption small {
  font: 12px/1.3 var(--ui);
  color: var(--faint);
  font-weight: 500;
}
svg { display: block; width: 100%; height: auto }
svg text { fill: var(--faint); font: 12px var(--ui) }
.note {
  margin: 8px 0 0;
  color: var(--faint);
  font: 12px/1.35 var(--ui);
}

.explain {
  display: grid;
  grid-template-columns: 1.4fr .8fr;
  gap: 16px;
  margin-top: 16px;
}
.explain > div {
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 14px 16px;
}
.explain h2 {
  margin: 0 0 6px;
  color: var(--navy-deep);
  font: 650 1rem/1.3 var(--ui);
}
#explanation { margin: 0; color: var(--ink) }
#sidebits { margin: 0; color: var(--faint); font: 14px/1.45 var(--ui) }
#measure-out {
  margin: 10px 0 0;
  min-height: 1.3em;
  font: 15px/1.4 var(--ui);
}
#measure-out strong { color: var(--brick) }

@media (max-width: 820px) {
  .plots, .explain { grid-template-columns: 1fr }
  #prob { margin-left: 0 }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important }
}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <h1>Grover-szimulátor</h1>
  </header>

  <form id="settings" novalidate>
    <label>Qubitek, n<input id="qubits" type="number" min="1" max="8" value="2" required></label>
    <label>Célindex<input id="target" type="number" min="0" max="3" value="2" required></label>
    <label>Iterációk, k<input id="iterations" type="number" min="0" max="40" value="1" required></label>
    <button id="suggest" type="button" title="k = ⌊π / (4θ)⌋, θ = arcsin(1/√N)">k ≈ π√N / 4</button>
    <button class="primary" type="submit">Indítás</button>
    <button id="measure" type="button">Mérés</button>
  </form>
  <p id="status" role="alert"></p>

  <div class="toolbar">
    <button id="previous" type="button">← Előző</button>
    <button id="next" type="button">Következő →</button>
    <button id="play" type="button" class="ghost">Lejátszás</button>
    <span id="step-label"></span>
    <span id="prob"></span>
    <div class="meter" aria-hidden="true"><i id="meter-fill"></i></div>
  </div>
  <div id="timeline" class="timeline" role="tablist" aria-label="Lépések"></div>

  <div class="plots">
    <figure>
      <figcaption>
        Amplitúdók
        <small id="legend"></small>
      </figcaption>
      <svg id="bars" viewBox="0 0 560 330" role="img" aria-label="Előjeles amplitúdók"></svg>
      <p class="note" id="bar-note">A vékony vízszintes vonal az előző érték. A pontozott vonal az átlag.</p>
    </figure>
    <figure>
      <figcaption>
        Grover-sík
        <small>x: kiegyenlített nem-cél · y: |w⟩</small>
      </figcaption>
      <svg id="plane" viewBox="0 0 340 330" role="img" aria-label="Állapotvektor az egységkörön"></svg>
      <p class="note" id="plane-note"></p>
    </figure>
  </div>

  <div class="explain">
    <div>
      <h2 id="explain-title">Mi történt</h2>
      <p id="explanation"></p>
      <p id="measure-out"></p>
    </div>
    <div>
      <h2>Ehhez a futáshoz</h2>
      <p id="sidebits"></p>
    </div>
  </div>
</main>
<script>
"use strict";
const datasets = __GROVER_DATA__;
const copy = {
  initial: [
    "Egyenletes szuperpozíció",
    "Hadamardok után minden bázisállapot 1/√N amplitúdóról indul. A cél mérési valószínűsége 1/N."
  ],
  oracle: [
    "Orákulum",
    "A megjelölt amplitúdó előjelet vált, a többi helyben marad. A mérési valószínűségek nem változnak: csak a fázis billen, ettől lesz a cél kilógó az átlaghoz képest."
  ],
  diffusion: [
    "Diffúzió",
    "Minden amplitúdó tükröződik az orákulum utáni m átlagra: a → 2m − a. A diffúzió a Grover-síkon a kezdőállapot irányára tükröz. Az orákulum és a diffúzió együtt 2θ-val forgatja az állapotot; a cél valószínűsége a csúcs után csökkenhet."
  ]
};
const $ = id => document.getElementById(id);
const qubits = $("qubits");
const target = $("target");
const iterations = $("iterations");
const status = $("status");
let history, size, nQubits, marked, position, playing = null, sample = null;

function ket(index) {
  return "|" + index.toString(2).padStart(nQubits, "0") + "⟩";
}

function recommended(n) {
  return datasets[n] && datasets[n].recommended;
}

function run() {
  const n = qubits.valueAsNumber;
  const index = target.valueAsNumber;
  const count = iterations.valueAsNumber;
  if (!Number.isInteger(n) || n < 1 || n > 8) {
    status.textContent = "n legyen 1 és 8 közötti egész.";
    return;
  }
  const nextSize = 2 ** n;
  if (!Number.isInteger(index) || index < 0 || index >= nextSize) {
    status.textContent = "A célindex 0 és " + (nextSize - 1) + " közé essen.";
    return;
  }
  if (!Number.isInteger(count) || count < 0 || count > 40) {
    status.textContent = "k legyen 0 és 40 közötti egész.";
    return;
  }
  nQubits = n;
  size = nextSize;
  marked = index;
  history = datasets[n].steps.slice(0, 2 * count + 1);
  position = 0;
  sample = null;
  status.textContent = "";
  $("measure-out").textContent = "";
  buildTimeline();
  draw();
}

function stopPlay() {
  if (playing) {
    clearInterval(playing);
    playing = null;
    $("play").textContent = "Lejátszás";
  }
}

function move(delta) {
  const nextPos = Math.max(0, Math.min(position + delta, history.length - 1));
  if (nextPos === position) {
    if (delta > 0) stopPlay();
    return;
  }
  position = nextPos;
  sample = null;
  $("measure-out").textContent = "";
  draw();
  if (position === history.length - 1) stopPlay();
}

function svgEl(parent, name, attrs, label) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
  if (label !== undefined) el.textContent = label;
  parent.append(el);
  return el;
}

function line(svg, x1, y1, x2, y2, stroke, extra = {}) {
  return svgEl(svg, "line", {x1, y1, x2, y2, stroke, ...extra});
}

function text(svg, x, y, label, anchor = "middle", fill) {
  const attrs = {x, y, "text-anchor": anchor, "dominant-baseline": "middle"};
  if (fill) attrs.fill = fill;
  svgEl(svg, "text", attrs, label);
}

function amp(step, i) {
  return i === marked ? step[3] : step[2];
}

function meanOf(step) {
  return ((size - 1) * step[2] + step[3]) / size;
}

function drawBars(step, prior) {
  const svg = $("bars");
  svg.replaceChildren();
  const defs = svgEl(svg, "defs", {});
  const pat = svgEl(defs, "pattern", {
    id: "gp", width: 14, height: 14, patternUnits: "userSpaceOnUse"
  });
  svgEl(pat, "path", {d: "M 14 0 L 0 0 0 14", fill: "none", stroke: "var(--rule)", "stroke-width": 1});
  svgEl(svg, "rect", {x: 0, y: 0, width: 560, height: 330, fill: "url(#gp)"});

  const mid = 152, scale = 118, left = 46, right = 544;
  for (const tick of [-1, -0.5, 0, 0.5, 1]) {
    const y = mid - scale * tick;
    line(svg, left, y, right, y, tick === 0 ? "var(--ink)" : "var(--rule)");
    text(svg, left - 8, y, String(tick).replace(".", ","), "end");
  }

  const mu = meanOf(step);
  const my = mid - scale * mu;
  line(svg, left, my, right, my, "var(--ochre)", {"stroke-dasharray": "3 4", "stroke-width": 1.4});

  const cell = (right - left) / size;
  const barW = Math.min(46, cell * 0.62);
  const stride = Math.max(1, Math.ceil((nQubits <= 4 ? 60 : 26) / cell));
  for (let i = 0; i < size; i++) {
    const cx = left + (i + 0.5) * cell;
    const value = amp(step, i);
    const y = mid - scale * value;
    const targetBar = i === marked;
    const bar = svgEl(svg, "rect", {
      x: cx - barW / 2,
      y: Math.min(mid, y),
      width: barW,
      height: Math.max(1.4, Math.abs(y - mid)),
      fill: targetBar ? "var(--brick)" : "var(--navy)",
      rx: 2,
      opacity: sample !== null && sample !== i ? 0.22 : 1
    });
    svgEl(bar, "title", {}, ket(i) + "  amp=" + value.toFixed(4).replace(".", ",") + "  P=" + (value * value * 100).toFixed(2).replace(".", ",") + "%");
    if (prior) {
      const oldY = mid - scale * amp(prior, i);
      line(svg, cx - barW / 2, oldY, cx + barW / 2, oldY, "var(--ink)", {"stroke-width": 1.5});
    }
    if (i % stride === 0) {
      const label = nQubits <= 4 ? ket(i) : String(i);
      text(svg, cx, 304, label);
    }
  }
}

function arrow(svg, x1, y1, x2, y2, color, width, dash) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  line(svg, x1, y1, x2, y2, color, {"stroke-width": width, "stroke-dasharray": dash});
  const pts = [[x2, y2], ...[-0.42, 0.42].map(off => [
    x2 - 12 * Math.cos(angle + off),
    y2 - 12 * Math.sin(angle + off)
  ])];
  svgEl(svg, "polygon", {points: pts.map(p => p.join(",")).join(" "), fill: color});
}

function drawPlane(step, prior) {
  const svg = $("plane");
  svg.replaceChildren();
  const cx = 170, cy = 158, r = 112;
  svgEl(svg, "circle", {cx, cy, r, fill: "var(--sheet)", stroke: "var(--rule)", "stroke-width": 1.5});
  for (const t of [0.25, 0.5, 0.75]) {
    svgEl(svg, "circle", {cx, cy, r: r * t, fill: "none", stroke: "var(--rule)"});
  }
  line(svg, cx - r - 10, cy, cx + r + 16, cy, "var(--faint)");
  line(svg, cx, cy + r + 10, cx, cy - r - 16, "var(--faint)");
  text(svg, cx + r + 24, cy + 1, "|s′⟩", "start", "var(--faint)");
  text(svg, cx + 14, cy - r - 12, "|w⟩", "start", "var(--brick)");

  const theta0 = Math.asin(1 / Math.sqrt(size));
  arrow(svg, cx, cy, cx + (r + 7) * Math.cos(theta0), cy - (r + 7) * Math.sin(theta0), "var(--ochre)", 1.4, "4 4");

  if (prior) {
    arrow(svg, cx, cy, cx + r * prior[4], cy - r * prior[5], "#9aa7b6", 2, "5 4");
  }
  arrow(svg, cx, cy, cx + r * step[4], cy - r * step[5], "var(--good)", 2.6, "none");

  const ang = Math.atan2(step[5], step[4]);
  const deg = ang * 180 / Math.PI;
  $("plane-note").textContent =
    "x = " + step[4].toFixed(4).replace(".", ",") + " · y = " + step[5].toFixed(4).replace(".", ",") +
    " · ∠ = " + deg.toFixed(1).replace(".", ",") + "°  (kezdeti θ = " +
    (theta0 * 180 / Math.PI).toFixed(1).replace(".", ",") + "°, okker szaggatott)";
}

function buildTimeline() {
  const box = $("timeline");
  box.replaceChildren();
  history.forEach((step, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = step[0];
    btn.textContent = i === 0 ? "H" : (step[0] === "oracle" ? "O" + step[1] : "D" + step[1]);
    btn.title = copy[step[0]][0];
    btn.addEventListener("click", () => {
      stopPlay();
      position = i;
      sample = null;
      $("measure-out").textContent = "";
      draw();
    });
    box.append(btn);
  });
}

function draw() {
  const step = history[position];
  const prior = history[position - 1];
  const [title, body] = copy[step[0]];
  const p = step[3] * step[3];
  const rec = recommended(nQubits);
  $("explain-title").textContent = title;
  $("step-label").textContent = (position + 1) + " / " + history.length +
    (step[1] ? " · " + step[1] + ". kör" : "");
  $("prob").textContent = "P(" + ket(marked) + ") = " + (100 * p).toFixed(2).replace(".", ",") + "%";
  $("meter-fill").style.width = (100 * p) + "%";
  $("explanation").textContent = body;
  $("legend").textContent = "N = " + size + " · piros: " + ket(marked) + " (index " + marked + ")";
  $("previous").disabled = position === 0;
  $("next").disabled = position === history.length - 1;
  [...$("timeline").children].forEach((btn, i) => {
    if (i === position) btn.setAttribute("aria-current", "step");
    else btn.removeAttribute("aria-current");
  });

  const extra = [];
  extra.push("θ = arcsin(1/√N) = " + (Math.asin(1 / Math.sqrt(size)) * 180 / Math.PI).toFixed(2).replace(".", ",") + "°");
  extra.push("ajánlott k = " + rec + ((history.length - 1) / 2 === rec ? " (ezt futtatod)" : ", most k = " + (history.length - 1) / 2));
  if (size === 2) {
    extra.push("Egy qubitnél a cél esélye minden iteráció után 50%.");
  } else if ((history.length - 1) / 2 > rec) {
    extra.push("k nagyobb az ajánlottnál: a cél valószínűsége a tetőzés után csökken.");
  }
  extra.push("átlagos amplitúdó most: " + meanOf(step).toFixed(4).replace(".", ","));
  $("sidebits").textContent = extra.join(" · ");

  drawBars(step, prior);
  drawPlane(step, prior);
}

function measure() {
  if (!history) return;
  const step = history[position];
  const pMark = step[3] * step[3];
  const r = Math.random();
  let outcome;
  if (r < pMark) outcome = marked;
  else {
    const unmarked = [...Array(size).keys()].filter(i => i !== marked);
    outcome = unmarked[Math.floor((r - pMark) / ((1 - pMark) / (size - 1)))];
    if (outcome === undefined) outcome = unmarked[unmarked.length - 1];
  }
  sample = outcome;
  const p = (outcome === marked ? pMark : (1 - pMark) / (size - 1));
  $("measure-out").innerHTML = "Mérés eredménye: <strong>" + ket(outcome) +
    "</strong>  (ehhez az állapothoz most P = " + (100 * p).toFixed(2).replace(".", ",") + "%).";
  draw();
}

$("settings").addEventListener("submit", event => {
  event.preventDefault();
  stopPlay();
  run();
});
qubits.addEventListener("input", () => {
  const n = qubits.valueAsNumber;
  if (datasets[n]) target.max = 2 ** n - 1;
});
$("suggest").addEventListener("click", () => {
  const data = datasets[qubits.valueAsNumber];
  if (data) {
    iterations.value = data.recommended;
    status.textContent = "";
  } else {
    status.textContent = "Az ajánláshoz n legyen 1…8.";
  }
});
$("previous").addEventListener("click", () => { stopPlay(); move(-1); });
$("next").addEventListener("click", () => { stopPlay(); move(1); });
$("measure").addEventListener("click", () => { stopPlay(); measure(); });
$("play").addEventListener("click", () => {
  if (playing) {
    stopPlay();
    return;
  }
  if (position === history.length - 1) position = -1;
  $("play").textContent = "Megállít";
  move(1);
  if (position < history.length - 1) playing = setInterval(() => move(1), 850);
  else stopPlay();
});
document.addEventListener("keydown", event => {
  if (event.target instanceof HTMLInputElement) return;
  if (event.key === "ArrowLeft") { stopPlay(); move(-1); }
  if (event.key === "ArrowRight") { stopPlay(); move(1); }
  if (event.key === " ") {
    event.preventDefault();
    $("play").click();
  }
});
run();
</script>
</body>
</html>
